<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einkaufsliste</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="topTitleWrap">
      <div class="topTitle" id="topTitle">Einkaufsliste</div>
      <div class="topSub" id="topSub">Public Sync</div>
    </div>

    <div class="topActions">
      <button class="navBtn" id="btnShare">Teilen</button>
    </div>
  </header>

  <main class="container">
    <section class="screen" id="screenMain">
      <div class="card">
        <h2 class="h2">Items</h2>

        <div class="row">
          <input id="itemInput" class="input" placeholder="+ Item hinzufügen (z.B. Tomaten)" />
          <button id="btnAdd" class="btn primary">Add</button>
        </div>

        <p class="muted" style="margin-top:10px;">
          Tipp: Klick auf ein Item = löschen. Sync läuft automatisch.
        </p>
      </div>

      <div class="card">
        <div id="itemsBox"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
