<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einkaufsliste</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <h1 class="title">Einkaufsliste</h1>
      <div class="subtitle" id="roomLabel"></div>
    </div>
    <button class="btn ghost" id="shareBtn">Teilen</button>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="card__head">
        <div class="card__title">Kategorien</div>
        <button class="btn" id="addCategoryBtn">+ Kategorie</button>
      </div>

      <div id="categories"></div>
    </section>
  </main>

  <template id="categoryTpl">
    <div class="section" draggable="true">
      <div class="section__head">
        <button class="chev" title="Ein-/Ausklappen">▾</button>

        <div class="section__title" contenteditable="true" spellcheck="false"></div>

        <div class="section__actions">
          <button class="btn tiny ghost moveUp" title="Hoch">↑</button>
          <button class="btn tiny ghost moveDown" title="Runter">↓</button>
          <button class="btn tiny danger delCat" title="Kategorie löschen">✕</button>
        </div>
      </div>

      <div class="section__body">
        <div class="adder">
          <input class="input itemInput" type="text" placeholder="Item hinzufügen…" />
          <button class="btn tiny addItemBtn">Add</button>
        </div>

        <div class="list"></div>
      </div>
    </div>
  </template>

  <template id="itemTpl">
    <div class="row">
      <button class="circle" title="Erledigt"></button>
      <div class="row__text"></div>
      <button class="trash" title="Löschen">✕</button>
    </div>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
